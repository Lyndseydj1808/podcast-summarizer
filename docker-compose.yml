services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5433, not 5432, so this doesn't collide with the Postgres
      # you already have installed and running natively on this machine.
      - "5433:5432"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Overrides the DATABASE_URL from .env (which points at localhost) so
      # the backend reaches Postgres by its service name instead.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      # The Google service account key is excluded from the image itself
      # (see backend/.dockerignore), so it's mounted in at runtime instead,
      # read-only, straight from your own machine.
      - ./backend/${GOOGLE_SERVICE_ACCOUNT_FILE}:/app/${GOOGLE_SERVICE_ACCOUNT_FILE}:ro

volumes:
  postgres_data:
